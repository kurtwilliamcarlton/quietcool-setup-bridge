name: Validate QuietCool Setup Bridge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile quietcool_bridge/server.py

      - name: Check wizard JavaScript syntax
        run: node --check quietcool_bridge/app.js
